<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xiaomi TV Club - הרשמה וקבלת מתנה</title>
  <link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>
  <div class="app-shell">

    <header class="brand-header">
      <img src="img/s_xiaomi.png" alt="Xiaomi" class="brand-logo brand-logo--secondary" />
      <img src="logo.png" alt="קבוצת Hemilton" class="brand-logo" />
    </header>

    <div class="progress-dots" aria-hidden="true">
      <span class="dot active" data-step="0"></span>
      <span class="dot" data-step="1"></span>
    </div>

    <!-- מסך 0: בחירת דגם הטלוויזיה -->
    <section id="screen-0" class="screen active" aria-labelledby="screen0-title">
      <div class="screen-header">
        <h1 id="screen0-title">📺 בחרו את הטלוויזיה שלכם</h1>
        <p>בחרו את הדגם שרכשתם כדי להמשיך</p>
      </div>

      <!-- הכרטיסים נטענים דינמית מ-items.json על ידי script.js -->
      <div class="machine-grid machine-grid--row" id="machine-grid" role="listbox" aria-label="דגמי טלוויזיה"></div>

      <!-- הגיפטקארד נחשף מיד עם בחירת הטלוויזיה, בסכום לפי הדגם -->
      <div class="giftcard-section" id="giftcard-section" hidden>
        <p class="giftcard-headline">🎁 המתנה שלכם</p>
        <div class="giftcard-visual">
          <img src="img/dreamcard.webp" alt="גיפטקארד Dream Card" class="giftcard-image" id="giftcard-image" />
        </div>
        <p class="giftcard-caption" id="giftcard-caption"></p>
      </div>

      <div class="form-actions">
        <button type="button" id="start-button" class="primary-button" disabled>המשך ←</button>
      </div>
    </section>

    <!-- מסך 1: פרטים אישיים -->
    <section id="screen-1" class="screen" aria-labelledby="screen1-title">
      <div class="screen-header">
        <h1 id="screen1-title">📝 מצטרפים למועדון</h1>
        <p>מלאו את הפרטים שלכם כדי להשלים את ההרשמה</p>
      </div>

      <form id="details-form" class="details-form" novalidate>
        <div class="field-group field-group--full store-section">
          <label>היכן רכשת את הטלוויזיה? <span class="optional-tag">(אופציונלי)</span></label>
          <div class="store-grid" id="store-grid" role="listbox" aria-label="רשת שיווק"></div>
          <input type="text" id="store-other" class="store-other-input" placeholder="שם החנות" hidden />
        </div>

        <div class="field-group">
          <label for="firstName">שם פרטי</label>
          <input type="text" id="firstName" name="firstName" required autocomplete="given-name" />
          <span class="error-msg" data-error-for="firstName"></span>
        </div>

        <div class="field-group">
          <label for="lastName">שם משפחה</label>
          <input type="text" id="lastName" name="lastName" required autocomplete="family-name" />
          <span class="error-msg" data-error-for="lastName"></span>
        </div>

        <div class="field-group">
          <label for="phone">טלפון</label>
          <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="05X-XXXXXXX" />
          <span class="error-msg" data-error-for="phone"></span>
        </div>

        <div class="field-group">
          <label for="email">אימייל</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="name@example.com" />
          <span class="error-msg" data-error-for="email"></span>
        </div>

        <div class="field-group field-group--full">
          <label for="invoice">חשבונית קנייה <span class="optional-tag">(אופציונלי)</span></label>
          <input type="file" id="invoice" name="invoice" accept="image/*,application/pdf" />
          <span class="file-hint" id="invoice-hint">תמונה או PDF, עד 5MB</span>
          <span class="error-msg" data-error-for="invoice"></span>
        </div>

        <div class="field-group field-group--full consent-group">
          <label class="consent-row">
            <input type="checkbox" id="marketing" name="marketing" />
            <span>אני מאשר/ת קבלת דיוור וחומר שיווקי</span>
          </label>

          <label class="consent-row" id="terms-row">
            <input type="checkbox" id="terms" name="terms" required />
            <span>קראתי ואני מאשר/ת את
              <a href="https://www.mi-il.co.il/terms" class="consent-link" target="_blank" rel="noopener noreferrer">התקנון</a>
              <span class="required-mark" aria-hidden="true">*</span></span>
          </label>
          <span class="error-msg" data-error-for="terms"></span>
        </div>

        <div class="form-actions">
          <button type="button" id="back-button" class="secondary-button">→ חזרה</button>
          <button type="submit" class="primary-button">אישור והרשמה</button>
        </div>
      </form>
    </section>

    <!-- מסך אישור -->
    <section id="screen-confirm" class="screen" aria-labelledby="confirm-title">
      <div class="confirm-panel">
        <div class="confirm-icon">✅</div>
        <h1 id="confirm-title">תודה, ההרשמה הושלמה!</h1>
        <p>פרטי ההרשמה שלכם:</p>
        <dl class="confirm-details" id="confirm-details"></dl>
        <button type="button" id="restart-button" class="secondary-button">הרשמה חדשה</button>
      </div>
    </section>

  </div>

  <script src="script.js?v=12"></script>
</body>
</html>
